<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cơ Hội Nhận 300K Free</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }
    body {
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    h1 {
      color: #e74c3c;
      font-size: 24px;
      margin-bottom: 20px;
    }
    p {
      font-size: 18px;
      color: #333;
    }
    .btn {
      background: #2ecee0;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 15px;
      width: 100%;
      transition: 0.2s;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .btn-option {
      background: #f8f9fa;
      color: #333;
      border: 2px solid #ddd;
      text-align: left;
    }
    .btn-option:hover {
      background: #e9ecef;
    }
    .hidden {
      display: none;
    }
    .troll-msg {
      color: #e74c3c;
      font-size: 26px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div id="home-page" class="card">
    <h1>🎉 CƠ HỘI NHẬN 300K FREE 🎉</h1>
    <p>Chỉ cần hoàn thành câu hỏi ngắn để nhận ngay quà tặng!</p>
    <button class="btn" onclick="startQuiz()">Trả lời câu hỏi để nhận</button>
  </div>

  <div id="quiz-page" class="card hidden">
    <h2>Câu hỏi 1/1</h2>
    <p><strong>Phúc có đẹp trai không?</strong></p>
    <button class="btn btn-option" onclick="finishQuiz()">A: Có</button>
    <button class="btn btn-option" onclick="finishQuiz()">B: Nhất thế giới</button>
    <button class="btn btn-option" onclick="finishQuiz()">C: Như A</button>
    <button class="btn btn-option" onclick="finishQuiz()">D: Hơn Bi</button>
  </div>

  <div id="result-page" class="card hidden">
    <p class="troll-msg">Tuất Bi Spam cái Cứt</p>
    <p>skibiditoilet
    hahahahahahaha</p>
  </div>

  <script>
    function startQuiz() {
      document.getElementById('home-page').classList.add('hidden');
      document.getElementById('quiz-page').classList.remove('hidden');
    }

    function finishQuiz() {
      document.getElementById('quiz-page').classList.add('hidden');
      document.getElementById('result-page').classList.remove('hidden');
    }
  </script>

</body>
</html>
